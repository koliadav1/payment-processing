[project]
name = "payment-management-system"
version = "1.0.0"
description = "Система управления платежами"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "fastapi==0.138.1",
    "faststream==0.7.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "SQLAlchemy==2.0.48",
    "uvicorn==0.42.0",
    "faststream[cli]",
    "faststream[rabbit]",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "black==26.3.1",
    "pytest>=9.0.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "pytest-mock==3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 79
force-exclude = "migrations"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest]
minversion = "9.0"
pythonpath = [
    "."
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.coverage.run]
omit = [
    "tests/*", 
    "venv/*", 
    "migrations/*", 
    "src/static/*", 
    "src/core/config.py",
    "src/core/database.py",
    "src/core/interfaces/*",
    "src/utils/dependencies.py", 
    "src/main.py",
    "src/schemas/*",
    "src/models/*",
    "src/admin/*",
    "src/repositories/unit_of_work.py",
    "*/__init__.py",
]
branch = true
concurrency = ["greenlet"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "class .*\\(Exception\\):",
]